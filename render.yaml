services:
  - type: web
    name: resolv-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: Resolv
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_REASONING_EFFORT
        value: low
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
